<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú con Logo y Dropdown - Estilo Gamer con Links, Sombras y Texto Interactivo</title>
<style>
  .custom-body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #111; /* Fondo oscuro estilo gamer */
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #333;
    color: white;
    padding: 10px 20px;
    position: fixed; /* Fijo en la parte superior */
    width: 100%; /* Ocupa todo el ancho de la página */
    top: 0; /* Posicionado en la parte superior */
    z-index: 1000; /* Asegura que el menú esté por encima de otros elementos */
  }
  .line {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 3px;
    background-color: #f08bd3; /* Inicialmente rosado neon */
    animation: changeColor 10s infinite; /* Cambia de color cada 5 segundos */
  }
  @keyframes changeColor {
    0%, 100% {
      background-color: #f08bd3; /* Rosado neon */
    }
    50% {
      background-color: #00b0f0; /* Azul neon */
    }
  }
  .logo img {
    height: 40px; /* Ajusta el tamaño del logo según sea necesario */
  }
  .menu {
    display: flex;
  }
  .menu a {
    text-decoration: none; /* Quitar subrayado predeterminado de los enlaces */
  }
  .menu button {
    background-color: #333;
    color: white;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease; /* Agregado box-shadow */
    border-radius: 20px; /* Pequeña curvatura */
    font-size: 16px;
    position: relative;
    overflow: hidden;
    display: inline-block; /* Asegura que los botones enlace ocupen solo el tamaño del contenido */
  }
  .menu button:hover {
    background-color: #0a84ff; /* Azul celeste sólido neon */
    color: #111; /* Cambio de color del texto */
    transform: scale(1.1); /* Efecto de zoom */
    box-shadow: 0 0 20px #00b0f0, 0 0 40px #00b0f0, 0 0 60px #00b0f0; /* Sombra neon azul más intensa */
  }
  .menu button:hover .button-text {
    color: #0a84ff; /* Cambio de color del texto al estilo gamer */
  }
  .dropdown-content {
    display: none;
    position: absolute;
    background-color: #333;
    min-width: 120px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
    z-index: 1;
  }
  .dropdown-content a {
    color: white;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    transition: background-color 0.3s ease;
  }
  .dropdown-content a:hover {
    background-color: #555;
  }
  .dropdown:hover .dropdown-content {
    display: block;
  }
  /* Estilo especial para el botón 6 */
  .menu .special-button {
    background-color: #f08bd3; /* Rosado */
    box-shadow: 0 0 15px #f08bd3; /* Sombra neon rosada */
  }
  .menu .special-button:hover {
    background-color: #f08bd3; /* Mantener el color rosado */
    box-shadow: 0 0 20px #f08bd3, 0 0 40px #f08bd3, 0 0 60px #f08bd3; /* Sombra neon rosada más intensa */
  }
  .menu .special-button .button-text {
    color: #f08bd3; /* Color inicial del texto */
  }
  .menu .special-button:hover .button-text {
    color: #f08bd3; /* Cambio de color del texto al estilo gamer */
  }
  /* Estilo fijo para el botón 2 */
  .menu .fixed-button {
    background-color: #0a84ff; /* Azul celeste sólido neon */
    box-shadow: 0 0 20px #00b0f0, 0 0 40px #00b0f0, 0 0 60px #00b0f0; /* Sombra neon azul más intensa */
  }
  .menu .fixed-button .button-text {
    color: #0a84ff; /* Color inicial del texto */
  }
  /* Asegura que el contenido principal no quede oculto detrás del menú fijo */
  .main-content {
    padding-top: 80px; /* Ajustar según la altura del menú */
  }
</style>
</head>
<body class="custom-body">

<div class="header">
  <div class="logo">
    <img src="ruta/al/logo.png" alt="Logo">
  </div>
  <div class="menu">
    <a href="pagina1.html"><button><span class="button-text">Botón 1</span></button></a>
    <a href="pagina2.html"><button class="fixed-button"><span class="button-text">Botón 2</span></button></a>
    <a href="pagina3.html"><button><span class="button-text">Botón 3</span></button></a>
    <a href="pagina4.html"><button><span class="button-text">Botón 4</span></button></a>
    <div class="dropdown">
      <button><span class="button-text">Botón 5</span> &#9662;</button>
      <div class="dropdown-content">
        <a href="opcion1.html">Opción 1</a>
        <a href="opcion2.html">Opción 2</a>
      </div>
    </div>
    <a href="pagina6.html"><button class="special-button"><span class="button-text">Botón 6</span></button></a>
  </div>
  <div class="line"></div>
</div>

<div class="main-content">
  <!-- Contenido principal de la página -->
</div>

</body>
</html>
