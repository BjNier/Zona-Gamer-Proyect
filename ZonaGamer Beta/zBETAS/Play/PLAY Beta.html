<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Consolas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        .room {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 90vw;
            margin: auto;
        }
        .console {
            background-color: #1f1f1f;
            border: 2px solid #00bfff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 15px #ff00ff;
            transition: transform 0.3s;
            font-size: 1.2em;
        }
        .console:hover {
            transform: scale(1.05);
        }
        .console-time {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00bfff;
            text-shadow: 0 0 5px #ff00ff;
        }
        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-buttons button {
            padding: 5px;
            background: linear-gradient(45deg, #00bfff, #ff00ff);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            transition: background 0.3s;
        }
        .control-buttons button:hover {
            background: linear-gradient(45deg, #ff00ff, #00bfff);
        }
        .console-number {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5em;
            color: #ff00ff;
        }

        @media (max-width: 768px) {
            .room {
                grid-template-columns: repeat(2, 1fr);
            }
            .console {
                padding: 10px;
                font-size: 1em;
            }
            .console-time {
                font-size: 1.5em;
            }
            .control-buttons button {
                font-size: 0.7em;
            }
        }

        @media (max-width: 480px) {
            .room {
                grid-template-columns: 1fr;
            }
            .console {
                padding: 5px;
                font-size: 0.8em;
            }
            .console-time {
                font-size: 1.2em;
            }
            .control-buttons button {
                font-size: 0.6em;
            }
        }
    </style>
</head>
<body>
    <div class="room">
        <div class="console" id="console1">
            <div class="console-number">1</div>
            <div class="console-time" id="time1">00:00</div>
            <div class="control-buttons">
                <button onclick="addTime('time1')">Aumentar 30m</button>
                <button onclick="reduceTime('time1')">Reducir 30m</button>
                <button onclick="startFreeTime('time1')">Libre</button>
            </div>
        </div>
        <div class="console" id="console2">
            <div class="console-number">2</div>
            <div class="console-time" id="time2">00:00</div>
            <div class="control-buttons">
                <button onclick="addTime('time2')">Aumentar 30m</button>
                <button onclick="reduceTime('time2')">Reducir 30m</button>
                <button onclick="startFreeTime('time2')">Libre</button>
            </div>
        </div>
        <div class="console" id="console3">
            <div class="console-number">3</div>
            <div class="console-time" id="time3">00:00</div>
            <div class="control-buttons">
                <button onclick="addTime('time3')">Aumentar 30m</button>
                <button onclick="reduceTime('time3')">Reducir 30m</button>
                <button onclick="startFreeTime('time3')">Libre</button>
            </div>
        </div>
        <div class="console" id="console4">
            <div class="console-number">4</div>
            <div class="console-time" id="time4">00:00</div>
            <div class="control-buttons">
                <button onclick="addTime('time4')">Aumentar 30m</button>
                <button onclick="reduceTime('time4')">Reducir 30m</button>
                <button onclick="startFreeTime('time4')">Libre</button>
            </div>
        </div>
        <div class="console" id="console5">
            <div class="console-number">5</div>
            <div class="console-time" id="time5">00:00</div>
            <div class="control-buttons">
                <button onclick="addTime('time5')">Aumentar 30m</button>
                <button onclick="reduceTime('time5')">Reducir 30m</button>
                <button onclick="startFreeTime('time5')">Libre</button>
            </div>
        </div>
        <div class="console" id="console6">
            <div class="console-number">6</div>
            <div class="console-time" id="time6">00:00</div>
            <div class="control-buttons">
                <button onclick="addTime('time6')">Aumentar 30m</button>
                <button onclick="reduceTime('time6')">Reducir 30m</button>
                <button onclick="startFreeTime('time6')">Libre</button>
            </div>
        </div>
        <div class="console" id="console7">
            <div class="console-number">7</div>
            <div class="console-time" id="time7">00:00</div>
            <div class="control-buttons">
                <button onclick="addTime('time7')">Aumentar 30m</button>
                <button onclick="reduceTime('time7')">Reducir 30m</button>
                <button onclick="startFreeTime('time7')">Libre</button>
            </div>
        </div>
        <div class="console" id="console8">
            <div class="console-number">8</div>
            <div class="console-time" id="time8">00:00</div>
            <div class="control-buttons">
                <button onclick="addTime('time8')">Aumentar 30m</button>
                <button onclick="reduceTime('time8')">Reducir 30m</button>
                <button onclick="startFreeTime('time8')">Libre</button>
            </div>
        </div>
    </div>

    <script>
        let times = {
            time1: 0,
            time2: 0,
            time3: 0,
            time4: 0,
            time5: 0,
            time6: 0,
            time7: 0,
            time8: 0,
        };

        let freeTimers = {
            time1: false,
            time2: false,
            time3: false,
            time4: false,
            time5: false,
            time6: false,
            time7: false,
            time8: false,
        };

        function updateDisplay() {
            for (let id in times) {
                let minutes = Math.floor(times[id] / 60);
                let seconds = times[id] % 60;
                document.getElementById(id).textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
        }

        function addTime(id) {
            times[id] += 30 * 60; // Añadir 30 minutos
            updateDisplay();
        }

        function reduceTime(id) {
            times[id] = Math.max(times[id] - 30 * 60, 0); // Reducir 30 minutos, asegurando que no sea menor a 0
            updateDisplay();
        }

        function startFreeTime(id) {
            freeTimers[id] = !freeTimers[id];
            document.querySelector(`#${id}`).parentElement.querySelector('.control-buttons button:last-child').textContent = freeTimers[id] ? "Detener" : "Libre";
        }

        setInterval(() => {
            for (let id in freeTimers) {
                if (freeTimers[id]) {
                    times[id]++;
                    updateDisplay();
                }
            }
        }, 1000);
    </script>
</body>
</html>
